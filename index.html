<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="성어 ver2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171A" media="(prefers-color-scheme: dark)">
<meta name="description" content="고사성어 정답지 304~337쪽을 네 파트로 나눠 푸는 개인 학습용 페이지">
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="icon-180.png">
<title>성어 뜻 맞히기 ver2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#F4F1E9; --card:#FDFCF8; --card-2:#F1EEE5;
  --ink:#1B1A17; --ink-2:#4D4B45; --ink-3:#7C7A72;
  --rule:#D9D4C6; --rule-2:#E8E4D9;
  --acc:#7A2E2E; --acc-ink:#FFFFFF;
  --ok:#2E7D4F; --ok-bg:#E5F0E8;
  --bad:#B8442C; --bad-bg:#FAE8E2;
  --warn:#9A6E00;
  --p1:#B8442C; --p2:#2A6FC4; --p3:#1E8A5F; --p4:#9A6E00;
  --shadow:0 1px 2px rgba(27,26,23,.05), 0 8px 24px rgba(27,26,23,.07);
  --shadow-lift:0 2px 4px rgba(27,26,23,.08), 0 16px 40px rgba(27,26,23,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16171A; --card:#202227; --card-2:#282B31;
    --ink:#EEEDE9; --ink-2:#B5B3AC; --ink-3:#807E77;
    --rule:#373A41; --rule-2:#2C2F35;
    --acc:#C87B6B; --acc-ink:#12100F;
    --ok:#4FA366; --ok-bg:#16301F;
    --bad:#D9694E; --bad-bg:#331910;
    --warn:#BC8318;
    --p1:#D9694E; --p2:#5B95E0; --p3:#4FA366; --p4:#BC8318;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#16171A; --card:#202227; --card-2:#282B31;
  --ink:#EEEDE9; --ink-2:#B5B3AC; --ink-3:#807E77;
  --rule:#373A41; --rule-2:#2C2F35;
  --acc:#C87B6B; --acc-ink:#12100F;
  --ok:#4FA366; --ok-bg:#16301F;
  --bad:#D9694E; --bad-bg:#331910;
  --warn:#BC8318;
  --p1:#D9694E; --p2:#5B95E0; --p3:#4FA366; --p4:#BC8318;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
.wrap{max-width:560px; margin:0 auto; padding:16px 16px 44px; min-height:100dvh}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
.ser{font-family:'Gowun Batang',serif}

.top{display:flex; align-items:center; gap:9px; margin-bottom:18px}
.brand{font-family:'Gowun Batang',serif; font-weight:700; font-size:20px; flex:1}
.brand span{font-family:'IBM Plex Sans KR',sans-serif; color:var(--ink-3); font-weight:400; font-size:12px; margin-left:7px}
.iconbtn{width:38px; height:38px; flex:none; border-radius:11px; border:1px solid var(--rule);
  background:var(--card); color:var(--ink-2); font-size:16px; cursor:pointer; display:grid; place-items:center}
.iconbtn:hover{background:var(--card-2)}
.iconbtn:focus-visible,.btn:focus-visible,.choice:focus-visible,.chip:focus-visible,
.modecard:focus-visible,.partcard:focus-visible{outline:3px solid var(--acc); outline-offset:2px}

.kicker{font-size:11.5px; font-weight:600; letter-spacing:.11em; color:var(--ink-3); margin:22px 0 9px}
h2{font-family:'Gowun Batang',serif; font-weight:700; font-size:20px; margin:0; text-wrap:balance}
.listhead{display:flex; align-items:center; gap:11px; margin-bottom:16px}
.listhead .sub{font-size:12px; color:var(--ink-3); margin-top:2px}

.overall{background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:15px 17px;
  box-shadow:var(--shadow); display:flex; align-items:center; gap:16px}
.overall .num{font-family:'Gowun Batang',serif; font-weight:700; font-size:34px; line-height:1}
.overall .sub{font-size:12.5px; color:var(--ink-3); margin-top:3px}
.rail{height:8px; border-radius:99px; background:var(--rule-2); overflow:hidden; flex:1}
.rail>i{display:block; height:100%; border-radius:99px; background:var(--acc); transition:width .5s cubic-bezier(.2,.8,.3,1)}

/* 파트 카드 */
.partcard{position:relative; display:block; width:100%; text-align:left; cursor:pointer; overflow:hidden;
  background:var(--card); border:1px solid var(--rule); border-radius:15px; padding:14px 15px 13px 18px;
  box-shadow:var(--shadow); color:inherit; font:inherit; margin-bottom:10px; transition:transform .12s}
.partcard:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.partcard .bar{position:absolute; inset:0 auto 0 0; width:5px; background:var(--pc)}
.partcard .hd{display:flex; align-items:baseline; gap:8px}
.partcard .pn{font-family:'Gowun Batang',serif; font-weight:700; font-size:17px; color:var(--pc)}
.partcard .pg{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-2)}
.partcard .cnt{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-3)}
.partcard .ft{display:flex; align-items:center; gap:8px; margin-top:10px}
.partcard .ft .rail>i{background:var(--pc)}
.partcard .pct{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-3); min-width:32px; text-align:right}
.partcard .tags{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.tag{font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--rule); color:var(--ink-3)}
.tag.warn{border-color:var(--bad); color:var(--bad)}

.modecard{display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer;
  background:var(--card); border:1px solid var(--rule); border-radius:15px; padding:14px 15px;
  box-shadow:var(--shadow); color:inherit; font:inherit; margin-bottom:9px; transition:transform .12s}
.modecard:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.modecard[disabled]{opacity:.5; cursor:not-allowed; transform:none; box-shadow:var(--shadow)}
.modecard .ic{width:42px; height:42px; flex:none; border-radius:12px; display:grid; place-items:center;
  font-size:19px; background:var(--card-2); border:1px solid var(--rule-2)}
.modecard .t{font-weight:600; font-size:15px}
.modecard .d{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.modecard .go{margin-left:auto; color:var(--ink-3); font-size:18px}

.btn{display:block; width:100%; padding:14px 16px; border-radius:13px; border:1px solid var(--acc);
  background:var(--acc); color:var(--acc-ink); font:inherit; font-weight:600; font-size:15.5px;
  cursor:pointer; text-align:center; box-shadow:var(--shadow)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card); color:var(--ink); border-color:var(--rule); box-shadow:none}
.btn.ghost:hover{background:var(--card-2); filter:none}
.btn[disabled]{opacity:.42; cursor:not-allowed; filter:none}
.btnrow{display:flex; gap:9px}
.btnrow>*{flex:1}

.chiprow{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:99px;
  border:1px solid var(--rule); background:var(--card); color:var(--ink-2); font:inherit; font-size:13px; cursor:pointer}
.chip.on{background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:600}
.chip .n{font-family:'IBM Plex Mono',monospace; font-size:11.5px; opacity:.72}

/* 풀이 */
.hud{display:flex; align-items:center; gap:10px; margin-bottom:12px; min-height:32px}
.hud .qn{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-3)}
.hud .sp{flex:1}
.streak{font-family:'Gowun Batang',serif; font-weight:700; font-size:13px; padding:3px 10px; border-radius:99px;
  background:var(--warn); color:#fff; opacity:0; transform:scale(.7); transition:opacity .2s, transform .2s}
.streak.on{opacity:1; transform:scale(1)}
.prog{height:5px; border-radius:99px; background:var(--rule-2); overflow:hidden; margin-bottom:16px}
.prog>i{display:block; height:100%; background:var(--pc,var(--acc)); border-radius:99px; transition:width .35s}

.qcard{background:var(--card); border:1px solid var(--rule); border-radius:18px; padding:26px 20px;
  text-align:center; box-shadow:var(--shadow); margin-bottom:14px; position:relative}
.qcard .tag2{position:absolute; top:11px; left:14px; font-size:10.5px; color:var(--ink-3);
  font-family:'IBM Plex Mono',monospace}
.qcard .xmark{position:absolute; top:10px; right:13px; font-size:12px; color:var(--bad)}
.seong{font-family:'Gowun Batang',serif; font-weight:700; font-size:clamp(30px,9vw,44px); line-height:1.25;
  letter-spacing:.06em}
.hanja{font-family:'Gowun Batang',serif; font-size:clamp(17px,5vw,22px); color:var(--ink-3);
  letter-spacing:.14em; margin-top:8px}
.ask{font-size:12.5px; color:var(--ink-3); margin-top:12px}

.choices{display:flex; flex-direction:column; gap:8px}
.choice{display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left; cursor:pointer;
  background:var(--card); border:1px solid var(--rule); border-radius:13px; padding:13px 14px;
  font:inherit; font-size:14.5px; color:var(--ink); box-shadow:var(--shadow); transition:transform .1s;
  word-break:keep-all; line-height:1.6; font-family:'Gowun Batang',serif}
.choice:hover:not([disabled]){transform:translateX(3px)}
.choice[disabled]{cursor:default}
.choice .k{width:24px; height:24px; flex:none; border-radius:7px; display:grid; place-items:center;
  background:var(--card-2); border:1px solid var(--rule-2); margin-top:1px;
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--ink-3)}
.choice.right{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.choice.right .k{background:var(--ok); border-color:var(--ok); color:#fff}
.choice.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad)}
.choice.wrong .k{background:var(--bad); border-color:var(--bad); color:#fff}
.choice.dim{opacity:.4}

.verdict{margin-top:13px; border-radius:13px; padding:15px 16px; box-shadow:var(--shadow); border:1px solid}
.verdict.ok{background:var(--ok-bg); border-color:var(--ok)}
.verdict.no{background:var(--bad-bg); border-color:var(--bad)}
.verdict .vh{font-weight:700; font-size:15px; margin-bottom:8px}
.verdict.ok .vh{color:var(--ok)} .verdict.no .vh{color:var(--bad)}
.verdict .vs{font-family:'Gowun Batang',serif; font-weight:700; font-size:20px; letter-spacing:.05em}
.verdict .vhj{font-family:'Gowun Batang',serif; font-size:15px; color:var(--ink-2); letter-spacing:.1em; margin-top:3px}
.verdict .vrow{display:flex; gap:8px; margin-top:9px; font-size:13.5px; line-height:1.65}
.verdict .vlab{flex:none; font-size:11px; color:var(--ink-3); padding:2px 7px; border-radius:99px;
  border:1px solid var(--rule); height:fit-content; margin-top:1px}
.verdict .vtx{font-family:'Gowun Batang',serif; color:var(--ink); word-break:keep-all}

.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}
60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
.floatup{position:fixed; left:50%; top:34%; transform:translateX(-50%); font-family:'Gowun Batang',serif;
  font-weight:700; font-size:28px; color:var(--ok); pointer-events:none; z-index:50; animation:fl .85s ease-out forwards}
@keyframes fl{0%{opacity:0; transform:translateX(-50%) translateY(14px) scale(.85)}
22%{opacity:1; transform:translateX(-50%) translateY(0) scale(1)}
100%{opacity:0; transform:translateX(-50%) translateY(-46px) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

.result{text-align:center; padding:8px 0 4px}
.result .head{font-size:15px; font-weight:600; color:var(--ink-2)}
.result .big{font-family:'Gowun Batang',serif; font-weight:700; font-size:54px; line-height:1; margin:6px 0}
.result .bigstars{font-size:32px; letter-spacing:5px; color:var(--warn); margin:8px 0 4px}
.result .bigstars .off{color:var(--rule)}
.result .newrec{display:inline-block; margin-top:8px; padding:4px 12px; border-radius:99px;
  background:var(--warn); color:#fff; font-size:12.5px; font-weight:600}
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:18px 0}
.stat{background:var(--card); border:1px solid var(--rule); border-radius:13px; padding:11px 8px; text-align:center; box-shadow:var(--shadow)}
.stat .v{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:19px}
.stat .l{font-size:11px; color:var(--ink-3); margin-top:2px}

.list{display:flex; flex-direction:column; gap:7px}
.row{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow)}
.row .rs{font-family:'Gowun Batang',serif; font-weight:700; font-size:16px; letter-spacing:.04em}
.row .rh{font-family:'Gowun Batang',serif; font-size:13px; color:var(--ink-3); letter-spacing:.08em; margin-left:7px}
.row .rm{font-size:13.5px; color:var(--ink-2); line-height:1.65; margin-top:4px;
  font-family:'Gowun Batang',serif; word-break:keep-all}
.row .rg{font-size:11px; color:var(--ink-3); margin-top:6px; font-family:'IBM Plex Mono',monospace}
.row.done{opacity:.55}
.note{font-size:12.5px; color:var(--ink-3); line-height:1.7; margin:10px 2px}
.empty{text-align:center; padding:38px 18px; color:var(--ink-3); font-size:14px; line-height:1.7;
  background:var(--card); border:1px dashed var(--rule); border-radius:15px}
</style>
</head>

<div class="wrap"><div id="app"></div></div>
<script>
/* 고사성어 ver2 · 정답지 304~337쪽 */

/* ============ 소리 ============ 아이패드는 첫 터치에서 오디오를 열어 줘야 소리가 난다 */
let AC = null;
function ac() {
  if (AC === null) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC || null;
}
function tone(freq, start, dur, vol, type) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function slide(f0, f1, start, dur, vol, type) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

let AUDIO_READY = false;
function unlockAudio() {
  if (AUDIO_READY) return;
  const c = ac(); if (!c) return;
  try {
    if (c.state === 'suspended') c.resume();
    const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource();
    src.buffer = b; src.connect(c.destination); src.start(0);
    AUDIO_READY = true;
  } catch (e) { }
}
['touchstart', 'touchend', 'pointerdown', 'click'].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { passive: true }));

function canStore() { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } }
const HAS_STORE = canStore();

  }
  for (const d of D) {

    if (!r) store.rec[d.i] = { m: 0, a: 0, w: 0 };
    else { if (r.m == null) r.m = 0; if (r.a == null) r.a = 0; if (r.w == null) r.w = 0; }

const $ = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[a[i], a[j]] = [a[j], a[i]]; } return a; };

const MASTER = 2;
const mastered = d => store.rec[d.i].m >= MASTER;
function pctOf(pool) {
  if (!pool.length) return 0;
  const got = pool.reduce((s, d) => s + Math.min(store.rec[d.i].m, MASTER), 0);
  return Math.round(got / (pool.length * MASTER) * 100);
}

// 성어를 보여 주고 뜻을 고르게 한다 (어제 게임과 같은 방식)
function makeQ(d) {
  const same = byPart[d.p].filter(x => x.i !== d.i);
  const taken = new Set([d.m]);
  const opts = [d.m];
  // 같은 묶음(주제)에서 먼저 — 그래야 만만하지 않다
  const near = shuffle(same.filter(x => x.b === d.b));
  const far = shuffle(same.filter(x => x.b !== d.b));
  for (const c of near.concat(far)) {
    if (opts.length >= 4) break;
    if (taken.has(c.m)) continue;      // 뜻이 똑같은 동의어는 보기로 쓰지 않는다
    taken.add(c.m); opts.push(c.m);
  }
  if (opts.length < 4) {
    for (const c of shuffle(D.slice())) {
      if (opts.length >= 4) break;
      if (taken.has(c.m)) continue;
      taken.add(c.m); opts.push(c.m);
    }
  }
  return { d, a: d.m, opts: shuffle(opts) };
}
function draw(pool, n) {
  return pool.map(d => ({ d, k: store.rec[d.i].m * 10 + Math.random() * 9 }))
    .sort((a, b) => a.k - b.k).slice(0, n).map(x => x.d);
}

          <span class="pct">${pc}%</span>
        </div>
      </button>`);
    card.onclick = () => screenPart(pt.id);
    box.append(card);
  });
  document.getElementById('toReport').onclick = screenReport;
  document.getElementById('toList').onclick = () => screenList(0);
  document.getElementById('toSet').onclick = screenSettings;
}

/* ---------- 파트 메뉴 ---------- */
function screenPart(pid) {

/* ---------- 풀이 ---------- */
let R = null;
function startRound(list, pid) {
  if (!list.length) return;
  R = { list, pid, idx: 0, right: 0, wrong: 0, streak: 0, best: 0, missed: [], locked: false };
  renderQ();
}

function renderQ() {
  const q = makeQ(R.list[R.idx]), d = q.d;
  R.q = q; R.locked = false;
  const pct = Math.round(R.idx / R.list.length * 100);
  app.innerHTML = '';
  app.append($(`
    <div style="--pc:${pcolor(R.pid)}">
      <div class="top">
        <button class="iconbtn" id="quit" aria-label="그만두기">✕</button>
        <div class="brand" style="font-size:16px">파트 ${R.pid}</div>
        <span class="streak" id="streak"></span>
      </div>
      <div class="hud">
        <span class="qn">${R.idx + 1} / ${R.list.length}</span>
        <span class="sp"></span>
        <span class="qn">맞힘 ${R.right} · 틀림 ${R.wrong}</span>
      </div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="qcard" id="qcard">
        <span class="tag2">${d.pg}쪽 · ${esc(d.b)}</span>
        ${d.x ? '<span class="xmark" title="교재에 틀린 표시가 있던 성어">✗</span>' : ''}
        <div class="seong">${esc(d.ko)}</div>
        <div class="hanja">${esc(d.hj)}</div>
        <div class="ask">이 성어의 뜻은?</div>
      </div>
      <div class="choices" id="choices"></div>
      <div id="after"></div>
    </div>`));
  const cb = document.getElementById('choices');
  const keys = ['①', '②', '③', '④'];
  q.opts.forEach((o, n) => {
    const b = $(`<button class="choice" data-v="${esc(o)}"><span class="k">${keys[n]}</span><span>${esc(o)}</span></button>`);
    b.onclick = () => answer(o, b);
    cb.append(b);
  });
  document.getElementById('quit').onclick = () => {
    const back = R.pid;
    if (confirm('그만둘까요? 지금까지 푼 건 저장돼요.')) { R = null; screenPart(back); }
  };
  showStreak();
}

function showStreak() {
  const el = document.getElementById('streak');
  if (!el) return;
  if (R.streak >= 2) { el.textContent = `${R.streak}연속`; el.classList.add('on'); }
  else el.classList.remove('on');
}

function floatText(t) {
  const el = $(`<div class="floatup">${esc(t)}</div>`);
  document.body.append(el); setTimeout(() => el.remove(), 900);
}

function answer(val, btn) {
  if (!R || R.locked) return;
  R.locked = true;
  const q = R.q, d = q.d, r = store.rec[d.i];
  const ok = val === q.a;
  r.a++;
  if (ok) { r.m = Math.min(3, r.m + 1); R.right++; R.streak++; R.best = Math.max(R.best, R.streak); }
  else { r.m = Math.max(0, r.m - 1); r.w++; R.wrong++; R.streak = 0; R.missed.push(d); }
  save();
  ok ? dingdong() : ttaeng();
  showStreak();
  if (ok) floatText(['좋아요!', '정확해요', '완벽!', '그렇죠'][R.streak % 4]);

  document.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if (b.dataset.v === q.a) b.classList.add('right');
    else if (b === btn) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const card = document.getElementById('qcard');
  if (card) card.classList.add(ok ? 'pop' : 'shake');

  const after = document.getElementById('after');
  after.append($(`
    <div class="verdict ${ok ? 'ok' : 'no'}">
      <div class="vh">${ok ? '맞았어요' : '아까워요'}</div>
      <div class="vs">${esc(d.ko)}</div>
      <div class="vhj">${esc(d.hj)}</div>
      ${d.ch ? `<div class="vrow"><span class="vlab">한자</span><span class="vtx">${esc(d.ch)}</span></div>` : ''}
      ${d.lit ? `<div class="vrow"><span class="vlab">글자 그대로</span><span class="vtx">${esc(d.lit)}</span></div>` : ''}
      <div class="vrow"><span class="vlab">뜻</span><span class="vtx">${esc(d.m)}</span></div>
    </div>`));
  const nb = $(`<button class="btn" id="next" style="margin-top:12px">${R.idx + 1 >= R.list.length ? '결과 보기' : '다음 문제'}</button>`);
  nb.onclick = () => { R.idx++; if (R.idx >= R.list.length) roundEnd(); else renderQ(); };
  after.append(nb);
  setTimeout(() => nb.focus(), 60);
}

/* ---------- 결과 ---------- */
function roundEnd() {
  const g = R, n = g.list.length, pid = g.pid;
  const acc = n ? Math.round(g.right / n * 100) : 0;
  const stars = g.right === n ? 3 : acc >= 80 ? 2 : acc >= 60 ? 1 : 0;
  const prev = store.best[pid] || 0;
  const rec = g.best > prev;
  if (rec) store.best[pid] = g.best;
  save();
  acc >= 80 ? fanfare() : levelup();
  const head = acc === 100 ? '전부 맞혔어요!' : acc >= 80 ? '잘했어요' : acc >= 60 ? '거의 됐어요' : '한 번 더 볼까요';
  const wn = wrongOf(pid).length;

  app.innerHTML = '';
  app.append($(`
    <div style="--pc:${pcolor(pid)}">
      <div class="result">
        <div class="head">${head}</div>
        <div class="big" style="color:var(--pc)">${g.right} / ${n}</div>
        <div class="bigstars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>
        ${rec ? '<div class="newrec">최고 연속 기록 ' + g.best + '개!</div>' : ''}
      </div>
      <div class="statgrid">
        <div class="stat"><div class="v">${acc}%</div><div class="l">정확도</div></div>
        <div class="stat"><div class="v">${g.best}</div><div class="l">최고 연속</div></div>
        <div class="stat"><div class="v">${pctOf(byPart[pid])}%</div><div class="l">파트 ${pid} 진도</div></div>
      </div>
      <div id="missed"></div>
      <div class="btnrow" style="margin-top:18px">
        <button class="btn ghost" id="again" ${wn ? '' : 'disabled'}>오답만 다시</button>
        <button class="btn" id="toPart">파트 ${pid}로</button>
      </div>
      <button class="btn ghost" id="home" style="margin-top:9px">처음으로</button>
    </div>`));

  if (g.missed.length) {
    const box = document.getElementById('missed');
    box.append($(`<div class="kicker">틀린 것 ${g.missed.length}개</div>`));
    const list = $('<div class="list"></div>');
    const seen = new Set();
    g.missed.forEach(d => {
      if (seen.has(d.i)) return; seen.add(d.i);
      list.append($(`<div class="row">
        <div><span class="rs">${esc(d.ko)}</span><span class="rh">${esc(d.hj)}</span></div>
        <div class="rm">${esc(d.m)}</div>
        ${d.lit ? `<div class="rg">글자 그대로 — ${esc(d.lit)}</div>` : ''}
      </div>`));
    });
    box.append(list);
  }
  document.getElementById('again').onclick = () => startRound(shuffle(wrongOf(pid)).slice(0, 15), pid);
  document.getElementById('toPart').onclick = () => { R = null; screenPart(pid); };
  document.getElementById('home').onclick = () => { R = null; screenHome(); };
  R = null;
}

function screenSettings() {
  app.innerHTML = '';

/* ---------- 틀린 문제 리포트 ---------- */
function tally(list) {
  let tries = 0, wrong = 0;
  for (const d of list) { const r = store.rec[d.i]; tries += r.a || 0; wrong += r.w || 0; }
  return { tries, wrong, rate: tries ? Math.round((tries - wrong) / tries * 100) : null };
}
function groupRows(keyFn, minTries) {
  const m = new Map();
  for (const d of D) { const k = keyFn(d); if (!m.has(k)) m.set(k, []); m.get(k).push(d); }
  const rows = [];
  for (const [k, list] of m) { const t = tally(list); if (t.tries >= (minTries || 1)) rows.push({ k, list, ...t }); }
  rows.sort((a, b) => (a.rate - b.rate) || (b.wrong - a.wrong));
  return rows;
}
function rateBar(rate) {
  const c = rate >= 80 ? 'var(--ok)' : rate >= 60 ? 'var(--warn)' : 'var(--bad)';
  return `<span style="display:inline-block;width:46px;height:6px;border-radius:99px;background:var(--rule-2);vertical-align:middle">
    <span style="display:block;width:${Math.max(rate, 3)}%;height:100%;border-radius:99px;background:${c}"></span></span>`;
}

function screenReport() {
  const all = tally(D);
  const miss = allWrong().sort((a, b) => store.rec[b.i].w - store.rec[a.i].w || a.p - b.p);
  app.innerHTML = '';
  app.append($(`
    <div>
      <div class="listhead">
        <button class="iconbtn" id="back" aria-label="뒤로">←</button>
        <div style="flex:1"><h2>틀린 문제 리포트</h2>
        <div class="sub">어느 파트에서 자꾸 막히는지</div></div>
      </div>
      ${all.tries ? `<div class="overall">
          <div><div class="num">${all.rate}%</div>
          <div class="sub">${all.tries}번 풀어서 ${all.wrong}번 틀렸어요</div></div>
          <div class="rail"><i style="width:${Math.max(all.rate, 1)}%"></i></div></div>`
      : '<div class="empty">아직 푼 문제가 없어요.<br>한 판 풀고 나면 여기에 약점이 정리됩니다.</div>'}
      <div id="rbody"></div>
    </div>`));
  document.getElementById('back').onclick = screenHome;
  const body = document.getElementById('rbody');
  if (!all.tries) return;

  const section = (title, rows, labelFn, id) => {
    if (!rows.length) return;
    body.append($(`<div class="kicker">${esc(title)}</div>`));
    const box = $(`<div${id ? ` id="${id}"` : ''} style="display:flex;flex-direction:column;gap:6px"></div>`);
    rows.forEach(r => box.append($(`<div class="chip" style="cursor:default">${labelFn(r)}
      <span class="n">${rateBar(r.rate)} ${r.rate}% · ${r.wrong}/${r.tries}</span></div>`)));
    body.append(box);
  };

  section('파트별 — 약한 곳이 위로',
    PARTS.map(p => ({ p, ...tally(byPart[p.id]) })).filter(r => r.tries).sort((a, b) => a.rate - b.rate),
    r => `<span style="width:9px;height:9px;border-radius:99px;background:${pcolor(r.p.id)};display:inline-block"></span>
          <span>파트 ${r.p.id} ${esc(r.p.name)}</span>`, 'rparts');
  section('약한 묶음 (2번 이상 푼 것)', groupRows(d => `${d.pg}쪽 · ${d.b}`, 2).slice(0, 8),
    r => `<span>${esc(r.k)}</span>`);

  body.append($(`<div class="kicker">아직 못 외운 성어 ${miss.length}개</div>`));
  if (!miss.length) body.append($('<div class="empty">없어요. 깨끗합니다.</div>'));
  else {
    const list = $('<div class="list"></div>');
    miss.forEach(d => list.append($(`<div class="row">
      <div><span class="rs">${esc(d.ko)}</span><span class="rh">${esc(d.hj)}</span>
      <span style="color:var(--bad);font-size:12px"> ✕${store.rec[d.i].w}</span></div>
      <div class="rm">${esc(d.m)}</div>
      <div class="rg">파트 ${d.p} · ${d.pg}쪽</div></div>`)));
    body.append(list);
  }

  const share = $('<button class="btn" id="rshare" style="margin-top:16px">아빠에게 보내기</button>');
  share.onclick = () => shareReport(share);
  body.append(share);
}

function reportText() {
  const all = tally(D), L = [];
  L.push('[고사성어 ver2 · 304~337쪽]');
  if (!all.tries) { L.push('아직 푼 문제가 없습니다.'); return L.join('\n'); }
  L.push(`정답률 ${all.rate}% — ${all.tries}번 풀어서 ${all.wrong}번 틀림`);
  L.push(`진도 ${pctOf(D)}% · 외운 성어 ${D.filter(mastered).length} / ${D.length}개`);
  L.push('');
  L.push('■ 파트별 (약한 곳이 위로)');
  PARTS.map(p => ({ p, ...tally(byPart[p.id]) })).filter(r => r.tries).sort((a, b) => a.rate - b.rate)
    .forEach(r => L.push(`  파트 ${r.p.id} ${r.p.name} — 정답률 ${r.rate}% (${r.wrong}/${r.tries} 틀림) · 진도 ${pctOf(byPart[r.p.id])}%`));
  const wg = groupRows(d => `${d.pg}쪽 · ${d.b}`, 2).slice(0, 5);
  if (wg.length) { L.push(''); L.push('■ 약한 묶음'); wg.forEach(r => L.push(`  ${r.k} — ${r.rate}%`)); }
  const miss = allWrong().sort((a, b) => store.rec[b.i].w - store.rec[a.i].w);
  L.push('');
  L.push(`■ 아직 못 외운 성어 ${miss.length}개`);
  miss.slice(0, 50).forEach((d, n) => L.push(`  ${n + 1}) ${d.ko}(${d.hj}) — ${d.m}  (${store.rec[d.i].w}번 틀림, 파트 ${d.p})`));
  if (miss.length > 50) L.push(`  … 외 ${miss.length - 50}개`);
  return L.join('\n');
}

async function shareReport(btn) {
  const txt = reportText();
  const label = btn ? btn.textContent : '';
  try { if (navigator.share) { await navigator.share({ title: '고사성어 ver2 틀린 문제', text: txt }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    await navigator.clipboard.writeText(txt);
    if (btn) { btn.textContent = '복사했어요 · 카톡에 붙여넣기'; setTimeout(() => btn.textContent = label, 2500); }
    return;
  } catch (e) { }
  if (!btn) return;
  const ta = $(`<textarea style="width:100%;height:220px;font-size:12px;font-family:monospace;margin-top:10px;
    border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--card);color:var(--ink)"></textarea>`);
  ta.value = txt; btn.after(ta); ta.select();
}

screenHome();
